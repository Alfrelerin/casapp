<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reparto de tareas</title>
  <meta name="description" content="Reparto de tareas del hogar de Laura y Alfre" />
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161519" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tareas" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="splash"><div class="spinner"></div><p>Cargando…</p></div>
  </div>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="semana" class="tab"><span class="tab-ico">✓</span><span>Semana</span></button>
    <button data-tab="balance" class="tab"><span class="tab-ico">⚖︎</span><span>Balance</span></button>
    <button data-tab="cocina" class="tab"><span class="tab-ico">◔</span><span>Cocina</span></button>
    <button data-tab="ajustes" class="tab"><span class="tab-ico">⚙︎</span><span>Ajustes</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && !location.search.includes('emulator')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
